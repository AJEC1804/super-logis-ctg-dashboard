<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SUPER LOGIS CTG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-dark: #0b2b45;
      --primary-blue: #0099cc;
      --accent-cyan: #00bcd4;
      --gray-light: #f5f7fa;
      --white: #ffffff;
    }

    body {
      background: linear-gradient(135deg, var(--primary-dark) 0%, #1a3a52 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .auth-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .auth-header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, #1a3a52 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .auth-header img {
      height: 50px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .auth-header h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -1px;
    }

    .auth-body {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-control {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(0, 153, 204, 0.1);
      outline: none;
    }

    .form-label {
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .btn-primary {
      background-color: var(--primary-blue);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-cyan);
      color: var(--primary-dark);
    }

    .auth-link {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-link:hover {
      color: var(--accent-cyan);
    }

    .alert {
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
    }

    .verification-code {
      font-size: 24px;
      letter-spacing: 5px;
      font-weight: bold;
      text-align: center;
      color: var(--primary-blue);
      font-family: 'Courier New', monospace;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid #eee;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 600;
      color: #999;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      color: var(--primary-blue);
      border-bottom-color: var(--primary-blue);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .role-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-option {
      position: relative;
    }

    .role-option input[type="radio"] {
      display: none;
    }

    .role-label {
      display: block;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      color: #666;
    }

    .role-option input[type="radio"]:checked + .role-label {
      border-color: var(--primary-blue);
      background-color: rgba(0, 153, 204, 0.1);
      color: var(--primary-blue);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-header">
        <img src="/assets/logo-original.svg" alt="SUPER LOGIS CTG">
        <h2>GESTORES LOGÍSTICOS</h2>
      </div>

      <!-- Body -->
      <div class="auth-body">
        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('login')">
            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
          </button>
          <button class="tab-btn" onclick="switchTab('register')">
            <i class="fas fa-user-plus"></i> Registrarse
          </button>
        </div>

        <!-- LOGIN TAB -->
        <div id="login" class="tab-content active">
          <form id="loginForm">
            <div class="form-group">
              <label class="form-label" for="loginEmail">Correo Electrónico</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="loginPassword">Contraseña</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
          </form>
        </div>

        <!-- REGISTER TAB -->
        <div id="register" class="tab-content">
          <!-- Step 1: Register Form -->
          <div id="registerStep1">
            <form id="registerForm">
              <div class="form-group">
                <label class="form-label">Tipo de Usuario</label>
                <div class="role-select">
                  <div class="role-option">
                    <input type="radio" id="roleUser" name="role" value="user" checked>
                    <label class="role-label" for="roleUser">
                      <i class="fas fa-user"></i><br>Cliente
                    </label>
                  </div>
                  <div class="role-option">
                    <input type="radio" id="roleEmployee" name="role" value="employee">
                    <label class="role-label" for="roleEmployee">
                      <i class="fas fa-briefcase"></i><br>Empleado
                    </label>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="registerName">Nombre Completo</label>
                <input type="text" class="form-control" id="registerName" placeholder="Juan Pérez" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="registerEmail">Correo Electrónico</label>
                <input type="email" class="form-control" id="registerEmail" placeholder="tu@correo.com" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="registerPassword">Contraseña</label>
                <input type="password" class="form-control" id="registerPassword" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn btn-primary">Continuar</button>
            </form>
          </div>

          <!-- Step 2: Verification Code -->
          <div id="registerStep2" style="display: none;">
            <div class="alert alert-info">
              <i class="fas fa-info-circle"></i> Se envió un código de verificación a tu correo. Ingresa el código a continuación.
            </div>
            <div class="form-group">
              <label class="form-label" for="verificationCode">Código de Verificación</label>
              <input type="text" class="form-control" id="verificationCode" placeholder="000000" maxlength="6" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="verifyCode()">Verificar Código</button>
            <button type="button" class="btn btn-secondary mt-2" onclick="backToRegister()" style="width: 100%;">Volver</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentEmail = '';
    let currentPassword = '';
    let currentName = '';
    let currentRole = 'user';

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.closest('.tab-btn').classList.add('active');
    }

    function showAlert(message, type = 'danger') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} alert-dismissible fade show`;
      alert.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alert);
      setTimeout(() => alert.remove(), 5000);
    }

    // Login Form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/dashboard.html';
        } else {
          showAlert(data.message, 'danger');
        }
      } catch (error) {
        showAlert('Error en el login: ' + error.message, 'danger');
      }
    });

    // Register Form
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const role = document.querySelector('input[name="role"]:checked').value;

      currentName = name;
      currentEmail = email;
      currentPassword = password;
      currentRole = role;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name, role })
        });
        const data = await response.json();

        if (data.success) {
          document.getElementById('registerStep1').style.display = 'none';
          document.getElementById('registerStep2').style.display = 'block';
          showAlert('Se envió un código a tu correo', 'info');
        } else {
          showAlert(data.message, 'danger');
        }
      } catch (error) {
        showAlert('Error en el registro: ' + error.message, 'danger');
      }
    });

    async function verifyCode() {
      const code = document.getElementById('verificationCode').value;

      if (!code) {
        showAlert('Ingresa el código', 'danger');
        return;
      }

      try {
        const verifyResponse = await fetch('/api/auth/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code })
        });
        const verifyData = await verifyResponse.json();

        if (!verifyData.success) {
          showAlert(verifyData.message, 'danger');
          return;
        }

        // Complete registration
        const completeResponse = await fetch('/api/auth/complete-registration', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: currentEmail,
            password: currentPassword,
            name: currentName,
            role: currentRole
          })
        });
        const completeData = await completeResponse.json();

        if (completeData.success) {
          localStorage.setItem('token', completeData.token);
          localStorage.setItem('user', JSON.stringify(completeData.user));
          showAlert('¡Bienvenido! Redirigiendo...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1500);
        } else {
          showAlert(completeData.message, 'danger');
        }
      } catch (error) {
        showAlert('Error: ' + error.message, 'danger');
      }
    }

    function backToRegister() {
      document.getElementById('registerStep1').style.display = 'block';
      document.getElementById('registerStep2').style.display = 'none';
      document.getElementById('alertContainer').innerHTML = '';
    }
  </script>
</body>
</html>
