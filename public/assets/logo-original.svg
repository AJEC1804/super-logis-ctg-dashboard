<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Black "S" -->
  <g>
    <path d="M 100 50 L 160 50 Q 180 50 180 70 L 160 90 Q 140 90 120 80 L 100 70 Z" fill="#000000"/>
    <path d="M 100 100 L 140 110 Q 160 120 180 130 L 160 150 Q 140 140 100 140 Z" fill="#000000"/>
    <rect x="100" y="60" width="40" height="40" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Blue "L" -->
  <g>
    <rect x="220" y="50" width="60" height="140" fill="url(#blueGrad)"/>
    <rect x="220" y="180" width="100" height="30" fill="url(#blueGrad)"/>
    <path d="M 280 50 Q 300 40 320 50 Q 310 65 290 70 Z" fill="#ffffff" opacity="0.4"/>
  </g>
  
  <!-- Wings (decorative element) -->
  <g>
    <path d="M 350 80 Q 380 60 420 80 Q 400 90 370 100 Z" fill="#999999" opacity="0.8"/>
    <path d="M 360 120 Q 390 140 430 130 Q 400 110 380 110 Z" fill="url(#blueGrad)" opacity="0.9"/>
    <path d="M 370 110 Q 395 135 440 140 Q 410 120 390 115 Z" fill="url(#blueGrad)"/>
  </g>
  
  <!-- Text: GESTORES LOGÍSTICOS -->
  <text x="100" y="220" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#000000" letter-spacing="2">
    GESTORES
  </text>
  <text x="380" y="220" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#0052cc" letter-spacing="2">
    LOGÍSTICOS
  </text>
</svg>